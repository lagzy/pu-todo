<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PU-Plan — was jetzt zu tun ist</title>
<meta name="description" content="Was in der PU-Lektion jetzt zu tun ist — für Vlad, Dorian und Edward. Gruppe 22.">
<meta name="theme-color" content="#f8f9fa">
<link rel="stylesheet" href="style.css?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("puplan.theme"); } catch (e) {}
    var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    if (!t) t = (mq && mq.matches) ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>

<header>
  <h1>PU-Plan</h1>
  <span class="who">Gruppe 22</span>
  <span class="spacer"></span>
  <span class="clock" id="clock">--:--</span>
  <button id="theme" type="button" aria-label="Hell oder dunkel">🌙</button>
</header>

<main id="app" aria-live="polite"></main>

<section class="more" id="more" hidden>
  <h2>Weitere Diensttage</h2>
  <div class="days" id="days"></div>
</section>

<footer>
  <p>Stand <span id="updated">—</span> · Plan von Gruppe 22</p>
</footer>

<script src="app.js?v=2"></script>
</body>
</html>
